<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de contratos</title>
</head>

<body>
    <img src="{{ empresa.logo }}" width="180px" height="82px">
    <table class="encabezado">
        <thead>
            <tr>
                <th colspan="2" style="width: 80%;">
                    <label>{{empresa.nombre}}</label><br>
                    <label>NIT: {{empresa.nit}}</label><br>
                    <label>LISTADO DE CONTRATOS</label>
                </th>
            </tr>
        </thead>
    </table>
    <div style="margin-top: 15px;">
        <table class="tdata" cellspacing="0" cellpadding="0">
            <thead>
                <tr>
                    <th width="10%">NRO CONTRATO</th>
                    <th width="13%">IDENTIFICACIÓN</th>
                    <th>NOMBRE</th>
                    <th>FECHA DE INGRESO</th>
                    <th>CENTRO COSTO</th>
                    <th width="8%">ESTADO</th>
                </tr>
            </thead>
            <tbody>
                {% for item in data %}
                <tr>
                    <td>{{item.id}}</td>
                    <td>{{item.persona.documento}}</td>
                    <td>{{item.persona.n_completo|upper}}</td>
                    <td>{{item.fecha_ingreso}}</td>
                    <td>{{item.foraneas.centro_costos}}</td>
                    <td style="text-align: center;">{{item.estado}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>

<style>
    .titulo {
        text-align: center;
        font-size: 16px;
    }

    table.tdata {
        border: 1px solid lightgray;
    }

    table.tdata tr>th {
        background-color: #e9ecef;
    }

    tr>th {
        padding-top: 5px;
        vertical-align: center;
    }

    tr>td {
        padding-top: 4px;
        padding-left: 3px;
    }

    .encabezado label {
        font-size: 12px;
    }
</style>
